<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <defs>
    <linearGradient id="accentline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6ea8ff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="420" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1397" height="417" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="412" width="1400" height="4" fill="url(#accentline)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>

  <g stroke="#6ea8ff" fill="none" stroke-width="1.6" stroke-linecap="round">
    <rect x="101" y="15.5" width="20" height="17" rx="6"/>
    <line x1="111" y1="15.5" x2="111" y2="11.5"/>
  </g>
  <circle cx="111" cy="10" r="1.6" fill="#6ea8ff"/>
  <circle cx="106.8" cy="22" r="1.7" fill="#6ea8ff"/>
  <circle cx="115.2" cy="22" r="1.7" fill="#6ea8ff"/>
  <path d="M107 27 Q111 30 115 27" stroke="#6ea8ff" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <text x="700" y="31" text-anchor="middle" font-size="13" fill="#8b949e">an academic research agent that has to prove every reference it hands you</text>

  <text x="60" y="158" font-size="64" font-weight="bold" fill="#e6edf3">doctor<tspan fill="#6ea8ff">-agent</tspan></text>
  <text x="60" y="196" font-size="14" fill="#c9d1d9">AI academic research and dissertation agent (IST standard)</text>

  <text x="60" y="232" font-size="12.5" fill="#8b949e">Python CLI over the Anthropic tool loop: 10 commands, 14 tools, 5 literature APIs.</text>
  <text x="60" y="256" font-size="12.5" fill="#8b949e">Citations are cross-checked against CrossRef, OpenAlex and Semantic Scholar before use.</text>

  <rect x="60" y="296" width="136" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="128" y="315" text-anchor="middle" font-size="11" fill="#c9d1d9">python &gt;= 3.11</text>
  <rect x="208" y="296" width="117" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="266.5" y="315" text-anchor="middle" font-size="11" fill="#c9d1d9">MIT licence</text>
  <rect x="337" y="296" width="143" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="408.5" y="315" text-anchor="middle" font-size="11" fill="#c9d1d9">10 CLI commands</text>
  <rect x="492" y="296" width="136" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="560" y="315" text-anchor="middle" font-size="11" fill="#c9d1d9">14 agent tools</text>
  <rect x="640" y="296" width="136" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="708" y="315" text-anchor="middle" font-size="11" fill="#c9d1d9">107 wiki pages</text>

  <rect x="940" y="88" width="400" height="252" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="960" y="114" font-size="12" font-weight="bold" fill="#6ea8ff">citation gate</text>

  <rect x="960" y="128" width="360" height="30" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="974" y="148" font-size="12" fill="#c9d1d9">CrossRef</text>
  <text x="1306" y="148" text-anchor="end" font-size="11" fill="#566070">query.title</text>

  <rect x="960" y="166" width="360" height="30" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="974" y="186" font-size="12" fill="#c9d1d9">OpenAlex</text>
  <text x="1306" y="186" text-anchor="end" font-size="11" fill="#566070">works search</text>

  <rect x="960" y="204" width="360" height="30" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="974" y="224" font-size="12" fill="#c9d1d9">Semantic Scholar</text>
  <text x="1306" y="224" text-anchor="end" font-size="11" fill="#566070">graph/v1</text>

  <rect x="960" y="244" width="360" height="34" rx="6" fill="#0d1117" stroke="#6ea8ff" stroke-opacity="0.5"/>
  <text x="974" y="265" font-size="11.5" fill="#6ea8ff">verified = score &gt;= 0.7 in 2 of 3</text>

  <text x="960" y="300" font-size="11" fill="#566070">[OK] · [WARN] · [FAIL] per citation</text>
  <text x="960" y="322" font-size="11" fill="#566070">one request per second, per source</text>

  <text x="700" y="360" text-anchor="middle" font-size="13" fill="#8b949e">it writes to the IST dissertation standard and refuses to invent a citation</text>
</svg>
