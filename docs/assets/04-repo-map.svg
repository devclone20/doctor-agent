<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 530" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <defs>
    <linearGradient id="accentline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6ea8ff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="530" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1097" height="527" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="522" width="1100" height="4" fill="url(#accentline)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>

  <g stroke="#6ea8ff" fill="none" stroke-width="1.6" stroke-linecap="round">
    <rect x="101" y="15.5" width="20" height="17" rx="6"/>
    <line x1="111" y1="15.5" x2="111" y2="11.5"/>
  </g>
  <circle cx="111" cy="10" r="1.6" fill="#6ea8ff"/>
  <circle cx="106.8" cy="22" r="1.7" fill="#6ea8ff"/>
  <circle cx="115.2" cy="22" r="1.7" fill="#6ea8ff"/>
  <path d="M107 27 Q111 30 115 27" stroke="#6ea8ff" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <text x="550" y="31" text-anchor="middle" font-size="13" fill="#8b949e">one repository, two layers over the same identity</text>

  <rect x="40" y="76" width="500" height="250" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="56" y="102" font-size="13" font-weight="bold" fill="#6ea8ff">apps/doctor — the Python agent</text>

  <text x="56" y="130" font-size="11.5" fill="#c9d1d9">cli/</text>
  <text x="190" y="130" font-size="11" fill="#8b949e">main.py, 10 typer commands</text>
  <text x="56" y="160" font-size="11.5" fill="#c9d1d9">core/</text>
  <text x="190" y="160" font-size="11" fill="#8b949e">agent loop, 14 tools, 5 search backends</text>
  <text x="56" y="190" font-size="11.5" fill="#c9d1d9">knowledge/</text>
  <text x="190" y="190" font-size="11" fill="#8b949e">107 wiki pages, FTS5 retriever</text>
  <text x="56" y="220" font-size="11.5" fill="#c9d1d9">memory/</text>
  <text x="190" y="220" font-size="11" fill="#8b949e">SQLite schema, session synthesis</text>
  <text x="56" y="250" font-size="11.5" fill="#c9d1d9">orchestration/</text>
  <text x="190" y="250" font-size="11" fill="#8b949e">section DAG runner, budget tracker</text>
  <text x="56" y="280" font-size="11.5" fill="#c9d1d9">skills/</text>
  <text x="190" y="280" font-size="11" fill="#8b949e">prompt modules, LaTeX and .docx</text>
  <text x="56" y="308" font-size="11" fill="#566070">7,589 lines of Python, no test suite committed</text>

  <rect x="560" y="76" width="500" height="250" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="576" y="102" font-size="13" font-weight="bold" fill="#6ea8ff">the iNFT overlay — Pi substrate</text>

  <text x="576" y="130" font-size="11.5" fill="#c9d1d9">identity.json</text>
  <text x="712" y="130" font-size="11" fill="#8b949e">names: Doctor · iNFT · Pi</text>
  <text x="576" y="160" font-size="11.5" fill="#c9d1d9">soul/</text>
  <text x="712" y="160" font-size="11" fill="#8b949e">neural_soul.md + lineage/</text>
  <text x="576" y="190" font-size="11.5" fill="#c9d1d9">.pi/</text>
  <text x="712" y="190" font-size="11" fill="#8b949e">settings.json, APPEND_SYSTEM.md</text>
  <text x="576" y="220" font-size="11.5" fill="#c9d1d9">scripts/</text>
  <text x="712" y="220" font-size="11" fill="#8b949e">setup · boot · personalize · manifest</text>
  <text x="576" y="250" font-size="11.5" fill="#c9d1d9">metadata/</text>
  <text x="712" y="250" font-size="11" fill="#8b949e">ERC-721 template + sha256 manifest</text>
  <text x="576" y="280" font-size="11.5" fill="#c9d1d9">skills/cmux/</text>
  <text x="712" y="280" font-size="11" fill="#8b949e">20 terminal recipes (MIT)</text>
  <text x="576" y="308" font-size="11" fill="#566070">no wallet by design — the agent moves no funds</text>

  <rect x="40" y="356" width="1020" height="104" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="56" y="382" font-size="13" font-weight="bold" fill="#6ea8ff">the rest of the tree</text>

  <text x="56" y="410" font-size="11.5" fill="#c9d1d9">security/</text>
  <text x="56" y="430" font-size="11" fill="#566070">semgrep rules, checklists</text>
  <text x="310" y="410" font-size="11.5" fill="#c9d1d9">.github/workflows/</text>
  <text x="310" y="430" font-size="11" fill="#566070">pip-audit, semgrep, gitleaks</text>
  <text x="564" y="410" font-size="11.5" fill="#c9d1d9">infra/scripts/</text>
  <text x="564" y="430" font-size="11" fill="#566070">ingest_ist, ingest_roadmaps</text>
  <text x="818" y="410" font-size="11.5" fill="#c9d1d9">training_reports/</text>
  <text x="818" y="430" font-size="11" fill="#566070">12 dated reports</text>
  <text x="56" y="452" font-size="11" fill="#8b949e">assets/ist/ carries the official IST logos and the 2026 graphic-norms manual</text>

  <text x="550" y="490" text-anchor="middle" font-size="13" fill="#8b949e">the agent code and the token identity ship in the same tree</text>
</svg>
