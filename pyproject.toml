[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doctor-agent"
version = "1.0.0"
description = "Doctor — AI Academic Research & Dissertation Agent (IST Standard)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.54.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "ddgs>=9.0.0",
    "requests>=2.31.0",
    "scholarly>=1.7.11",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7.0",
    "ggshield>=1.34.0",
    "bandit>=1.8.0",
    "pip-audit>=2.7.0",
    "safety>=3.2.0",
    "pip-licenses>=4.5.0",
    "cyclonedx-bom>=4.4.0",
    "semgrep>=1.70.0",
]

[project.scripts]
doctor = "doctor.cli.main:app"

[tool.setuptools.packages.find]
include = ["doctor*"]
