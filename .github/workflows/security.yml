name: Security Audit

# Auditoria de segurança do doctor-agent — reconstruída 2026-08-13.
#
# Leis de desenho (a versão anterior falhou em TODOS os runs durante 3 semanas):
#
# 1. O gate distingue gravidade. Bloquear em QUALQUER achado (era `--error`)
#    transforma o vermelho em ruído de fundo e ninguém volta a olhar. Aqui:
#    segredos e ERROR bloqueiam; WARNING fica registado no resumo do run.
# 2. Nenhum job depende de artefactos de outro job por download implícito. O
#    relatório consolidado é um job próprio com `needs:` — antes, o passo do
#    Gitleaks tentava descarregar o artefacto do pip-audit e rebentava em
#    cascata quando esse job falhava.
# 3. Todas as actions fixadas por SHA de commit, não por tag móvel. Uma tag
#    pode ser reapontada por quem controla a action; um SHA não. (Isto também
#    silencia, de forma honesta, as 10 ocorrências de
#    `github-actions-mutable-action-tag` que o próprio Semgrep reportava.)
# 4. Versões de ferramentas fixadas e sujeitas à lei de quarentena de 14 dias
#    do dono: semgrep 1.172.0 (28-07) e gitleaks-action v2 — nenhuma publicada
#    nos últimos 14 dias.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Segunda-feira 06:00 UTC — auditoria semanal de dependências
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # CVEs nas dependências. NÃO bloqueia: um CVE transitivo sem correcção
  # disponível não deve impedir merges — deve ser visível. Fica no resumo.
  # ---------------------------------------------------------------------------
  dependencies:
    name: Dependências (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Instalar o projecto e o pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pip-audit

      - name: Auditar o ambiente resolvido
        id: audit
        # O ambiente instalado É a resolução real das dependências do
        # pyproject.toml. A versão anterior passava a saída de texto de
        # `pip install --dry-run` a `--requirement`, o que dava
        # "argument project_path: not allowed with argument -r/--requirement"
        # e falhava sempre.
        run: |
          set +e
          pip-audit --desc --format json --output pip-audit-report.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
          set -e
          test -f pip-audit-report.json || echo '{"dependencies":[]}' > pip-audit-report.json

      - name: Resumo legível
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          data = json.loads(pathlib.Path("pip-audit-report.json").read_text() or "{}")
          deps = data.get("dependencies", [])
          vuln = [d for d in deps if d.get("vulns")]
          print("## Dependências (pip-audit)\n")
          if not vuln:
              print(f"Sem vulnerabilidades conhecidas em {len(deps)} pacotes.")
          else:
              print(f"**{len(vuln)} pacote(s) com CVE** de {len(deps)} auditados.\n")
              print("| Pacote | Versão | ID | Correcção |")
              print("| --- | --- | --- | --- |")
              for d in vuln:
                  for v in d["vulns"]:
                      fix = ", ".join(v.get("fix_versions") or []) or "—"
                      print(f"| {d['name']} | {d['version']} | {v['id']} | {fix} |")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # SAST. Um único scan (a versão anterior corria os mesmos 3 rulesets três
  # vezes). Bloqueia só em severidade ERROR.
  # ---------------------------------------------------------------------------
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Instalar o Semgrep (versão fixa)
        run: pip install semgrep==1.172.0

      - name: Validar as regras próprias
        # Uma regra que não faz parse derruba o ficheiro INTEIRO em silêncio —
        # foi o que aconteceu: 13 regras do doctor estiveram mortas sem aviso.
        run: semgrep --validate --config security/semgrep_rules.yaml --metrics=off

      - name: Scan
        run: |
          semgrep scan \
            --config p/python \
            --config p/secrets \
            --config p/owasp-top-ten \
            --config security/semgrep_rules.yaml \
            --metrics=off --json --output semgrep-report.json .

      - name: Resumo e gate por severidade
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          res = json.loads(pathlib.Path("semgrep-report.json").read_text()).get("results", [])
          err = [r for r in res if r["extra"]["severity"] == "ERROR"]
          warn = [r for r in res if r["extra"]["severity"] == "WARNING"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("## SAST (Semgrep)\n\n")
              fh.write(f"{len(err)} erro(s) · {len(warn)} aviso(s) em {len(res)} achado(s).\n\n")
              if res:
                  fh.write("| Sev | Regra | Ficheiro:linha |\n| --- | --- | --- |\n")
                  for r in err + warn:
                      rule = r["check_id"].split(".")[-1]
                      fh.write(f"| {r['extra']['severity']} | {rule} | {r['path']}:{r['start']['line']} |\n")
          for r in err:
              print(f"::error file={r['path']},line={r['start']['line']}::{r['check_id']} — {r['extra']['message'][:180]}")
          for r in warn:
              print(f"::warning file={r['path']},line={r['start']['line']}::{r['check_id']}")
          sys.exit(1 if err else 0)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Segredos no histórico. Bloqueia sempre — um segredo commitado é incidente.
  # As excepções conhecidas vivem em .gitleaks.toml, com justificação escrita.
  # ---------------------------------------------------------------------------
  secrets:
    name: Segredos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ---------------------------------------------------------------------------
  # Relatório consolidado — job próprio, com os artefactos dos anteriores.
  # `always()` para haver relatório mesmo quando um scan bloqueia.
  # ---------------------------------------------------------------------------
  report:
    name: Relatório consolidado
    runs-on: ubuntu-latest
    needs: [dependencies, sast, secrets]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
        continue-on-error: true

      - name: Gerar
        run: |
          test -f artifacts/pip-audit-report.json || echo '{"dependencies":[]}' > artifacts/pip-audit-report.json
          echo '[]' > artifacts/gitleaks-report.json
          python security/generate_security_report.py \
            --gitleaks artifacts/gitleaks-report.json \
            --pip-audit artifacts/pip-audit-report.json \
            --output security-report.md
          cat security-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-report
          path: security-report.md
          retention-days: 30
